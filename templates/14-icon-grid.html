<!DOCTYPE html><html><head><meta charset='utf-8'><title>14-icon-grid</title></head><body>
<style>*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100vh;overflow:hidden;background:#0a0a14;font-family:system-ui,sans-serif}
.slide{width:100vw;height:100vh;display:flex;flex-direction:column;justify-content:center;padding:5% 7%;background:#141425;color:#e2e8f0}
h2{color:#f97316;font-size:clamp(28px,5vw,72px);font-weight:700;line-height:1.1;margin-bottom:3%}
.kicker{color:#94a3b8;font-size:clamp(14px,1.5vw,22px);text-transform:uppercase;letter-spacing:3px;margin-bottom:2%}
.big{font-size:clamp(22px,3.5vw,56px);font-weight:600;line-height:1.2}
.point{font-size:clamp(18px,2.5vw,40px);line-height:1.35;margin-bottom:2%;padding-left:3%;border-left:5px solid #f97316}
.muted{color:#94a3b8}
.accent{color:#f97316}
.figure{flex:1;background:#0f172a;border:1px solid #334155;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#f97316;font-size:clamp(14px,1.5vw,24px)}
.grid{display:grid;gap:clamp(12px,2vw,28px)}
.metric{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:clamp(16px,3vw,40px);text-align:center}
.metric .num{color:#f97316;font-size:clamp(32px,6vw,90px);font-weight:800}
.metric .label{color:#94a3b8;font-size:clamp(12px,1.2vw,18px);margin-top:8px;text-transform:uppercase}
table{width:100%;border-collapse:collapse;font-size:clamp(16px,2vw,32px)}
td,th{padding:clamp(10px,1.5vw,20px);border:1px solid #334155;text-align:left}
td:first-child{color:#94a3b8;width:30%;font-weight:600}
th{color:#f97316;text-transform:uppercase}.grid{grid-template-columns:repeat(3,1fr)}.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:clamp(16px,2.5vw,36px);text-align:center}.card .icon{font-size:clamp(28px,4vw,56px);margin-bottom:8%}.card .lbl{font-size:clamp(14px,1.6vw,24px)}</style>
<div class="slide">
<h2>Capabilities.</h2>
<div class="grid">
<div class="card"><div class="icon accent">A</div><div class="lbl">Label 1</div></div>
<div class="card"><div class="icon accent">B</div><div class="lbl">Label 2</div></div>
<div class="card"><div class="icon accent">C</div><div class="lbl">Label 3</div></div>
<div class="card"><div class="icon accent">D</div><div class="lbl">Label 4</div></div>
<div class="card"><div class="icon accent">E</div><div class="lbl">Label 5</div></div>
<div class="card"><div class="icon accent">F</div><div class="lbl">Label 6</div></div>
</div>
</div>
</body></html>
